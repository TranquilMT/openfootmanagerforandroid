name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/phase-1-bootstrap

concurrency:
  group: android-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Require and validate committed 2026/27 database snapshot
        run: |
          set -euo pipefail
          DB="src-tauri/databases/openfootball-2026-27.json"
          test -s "$DB" || { echo 'ERROR: committed 2026/27 database snapshot is missing or empty'; exit 1; }
          git ls-files --error-unmatch "$DB" >/dev/null || { echo 'ERROR: database exists in workspace but is not tracked by Git'; exit 1; }
          node scripts/validate-real-database.mjs "$DB"
          node - "$DB" <<'NODE'
          const fs = require('fs');
          const db = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const players = Array.isArray(db.players) ? db.players.length : 0;
          const teams = Array.isArray(db.teams) ? db.teams.length : 0;
          const nationalTeams = Array.isArray(db.national_teams) ? db.national_teams.length :
            (Array.isArray(db.nationalTeams) ? db.nationalTeams.length : 0);
          console.log(`Committed database: ${teams} teams, ${players} players, ${nationalTeams} national teams`);
          if (players < 12000) throw new Error(`Player count too low: ${players}`);
          if (teams < 800) throw new Error(`Team count too low: ${teams}`);
          NODE

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Frontend build
        env:
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Build signed ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          VITE_APP_BUILD_NUMBER: ${{ github.run_number }}
        run: npx tauri android build --debug --apk --target aarch64

      - name: Verify APK signature, ARM64 payload and bundled database
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then
            echo 'Unexpected non-ARM64 native libraries found'
            exit 1
          fi
          unzip -l "$APK" | grep -F 'openfootball-2026-27.json' >/dev/null || {
            echo '2026/27 database is missing from APK'
            exit 1
          }
          mkdir -p dist-apk
          cp "$APK" "dist-apk/OpenFootManagerAndroid-Build${GITHUB_RUN_NUMBER}-Nightly.apk"
          sha256sum "dist-apk/OpenFootManagerAndroid-Build${GITHUB_RUN_NUMBER}-Nightly.apk" | tee "dist-apk/OpenFootManagerAndroid-Build${GITHUB_RUN_NUMBER}-Nightly.apk.sha256"

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenFootManagerAndroid-Build${{ github.run_number }}-Nightly
          path: dist-apk/*
          if-no-files-found: error
