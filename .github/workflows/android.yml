name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android/phase-1-bootstrap

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@^2

      - name: Frontend build
        run: npm run build

      - name: Initialize Android project if needed
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          fi

      - name: Build signed ARM64 debug APK
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: npx tauri android build --debug --apk --target aarch64

      - name: Verify APK signature and ARM64 payload
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          echo "APK: $APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/.*\.so' >/dev/null
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/.*\.so'; then
            echo 'Unexpected non-ARM64 native libraries found'
            exit 1
          fi
          mkdir -p dist-apk
          cp "$APK" dist-apk/OpenFootManager-ARM64.apk
          sha256sum dist-apk/OpenFootManager-ARM64.apk | tee dist-apk/OpenFootManager-ARM64.apk.sha256

      - name: Upload installable ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: openfoot-manager-android-arm64-installable
          path: dist-apk/*
          if-no-files-found: error
