[package]
name = "openfootmanager"
version = "0.1.0"
description = "Openfoot Manager Android Alpha"
authors = ["Sturdy Robot (admin@esportsmanager.net)"]
edition = "2021"
publish = false

[lib]
name = "openfootmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/ofm_core", "crates/db", "crates/domain", "crates/engine", "crates/sim-bench", "crates/ofm-cli"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
domain = { path = "crates/domain" }
ofm_core = { path = "crates/ofm_core" }
engine = { path = "crates/engine" }
db = { path = "crates/db" }
chrono = "0.4.44"
rand = "0.10"
semver = "1"
base64 = "0.22"
image = { version = "0.25.6", default-features = false, features = ["png", "webp"] }
webp = "0.3.1"
time = "=0.3.51"
csv = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[features]
mcp = ["dep:rmcp", "dep:axum", "dep:tokio"]
save-snapshots = ["db/save-snapshots"]

[dependencies.rmcp]
version = "1.7"
features = ["server", "transport-streamable-http-server", "macros"]
optional = true

[dependencies.axum]
version = "0.8"
optional = true

[dependencies.tokio]
version = "1"
features = ["net", "rt-multi-thread", "macros", "signal"]
optional = true
